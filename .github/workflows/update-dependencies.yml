name: Patch vulnerable dependency lockfile
on:
  push:
    branches: [security-hardening-2026-10-29]
    paths:
      - '.github/workflows/update-dependencies.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Patch dependencies within allowed versions
        run: npm audit fix --package-lock-only
      - name: Verify patched lockfile installs
        run: npm ci
      - name: Verify patched code
        run: npm test
      - name: Verify production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Commit patched lockfile to working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: patch vulnerable locked dependencies"
            git push origin HEAD:security-hardening-2026-10-29
          fi
