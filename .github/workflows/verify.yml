name: Verify DriveX
on:
  push:
    branches: [security-hardening-2026-10-29]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax-check JavaScript
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Run unit tests
        run: npm test
      - name: Report dependency advisories
        run: npm audit --omit=dev || true
